<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FL26 Face Builder V2 — 零克隆 · 独立脸槽 · 照片骨架</title>
<style>
* { box-sizing: border-box; }
body { background:#12141a; color:#e8eaf0; font:14px/1.5 "Segoe UI",system-ui,sans-serif; margin:0; padding:24px; }
h1 { font-size:20px; margin:0 0 4px; } .tag { color:#8fd3ff; font-size:12px; font-weight:normal; }
.sub { color:#9aa2b1; font-size:12px; margin-bottom:18px; max-width:900px; }
.step { background:#1a1e28; border:1px solid #2a3040; border-radius:10px; padding:16px 18px; margin-bottom:14px; max-width:1100px; }
.step h2 { font-size:15px; margin:0 0 10px; color:#cfd6e4; }
.step h2 .no { display:inline-block; background:#2f6fed; color:#fff; border-radius:6px; padding:0 8px; margin-right:8px; font-size:13px; }
.drop { border:2px dashed #3a4358; border-radius:10px; padding:22px; text-align:center; color:#8b93a5; cursor:pointer; }
.drop.on { border-color:#2f6fed; }
.thumbs { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
.thumbs .th { position:relative; width:110px; }
.thumbs img { width:110px; height:110px; object-fit:cover; border-radius:8px; border:1px solid #333c4f; }
.pmark { position:absolute; top:4px; left:4px; background:#2f6fed; font-size:10px; padding:1px 6px; border-radius:4px; }
.row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
label.f { display:flex; flex-direction:column; gap:4px; font-size:12px; color:#9aa2b1; }
select,input[type=text],input[type=number] { background:#0f1117; color:#e8eaf0; border:1px solid #333c4f; border-radius:8px; padding:7px 10px; min-width:130px; }
button { background:#2f6fed; border:0; color:#fff; border-radius:8px; padding:9px 18px; font-size:14px; cursor:pointer; }
button:disabled { background:#3a4358; cursor:not-allowed; }
button.sec { background:#2a3040; }
.prog { font-family:Consolas,monospace; font-size:12px; color:#9fd48f; min-height:18px; white-space:pre-wrap; }
.cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:12px; }
.card { background:#0f1117; border:2px solid #2a3040; border-radius:10px; overflow:hidden; }
.card.sel { border-color:#2f6fed; }
.card img { width:100%; display:block; }
.card .cb { padding:8px 10px; font-size:12px; }
.card .cb b { font-size:13px; }
.rej { opacity:.45; }
.badge { float:right; font-size:11px; padding:1px 6px; border-radius:4px; background:#233a23; color:#8fd48f; }
.badge.r { background:#3a2323; color:#d48f8f; }
.viewlinks a { color:#8fd3ff; margin-right:6px; text-decoration:none; }
.muted { color:#8b93a5; font-size:12px; }
.kv { font-family:Consolas,monospace; font-size:12px; color:#9fd48f; white-space:pre-wrap; }
.card .imgbox { position:relative; background:radial-gradient(ellipse at 50% 30%, #2c4a2f 0%, #14201a 70%, #0c1015 100%); }
.np { display:flex; align-items:center; gap:8px; background:linear-gradient(90deg, rgba(10,14,20,.92), rgba(10,14,20,.55)); padding:5px 10px; position:absolute; left:0; right:0; bottom:0; }
.np .num { font-size:18px; font-weight:800; font-style:italic; color:#ffd75e; }
.np .nm { font-size:14px; font-weight:700; letter-spacing:.5px; color:#fff; text-transform:uppercase; }
.np .pos { margin-left:auto; font-size:11px; color:#9fd48f; border:1px solid #3a5a3a; border-radius:4px; padding:0 5px; }
</style>
</head>
<body>
<h1>FL26 Face Builder <span class="tag">V2 · 零克隆 · 每人独立脸槽 · 照片骨架</span></h1>
<div class="sub">球员记录从零构建，不复制任何现有球员的字节。脸纹理 100% 来自照片（黄金 bake8 链），头骨形状由照片 468 个 3D 关键点重塑，卡片渲染 = 游戏同款 Unity 管线。</div>

<div class="step">
  <h2><span class="no">①</span>上传照片（1–3 张，第一张为主照片）</h2>
  <div class="drop" id="drop">拖拽照片到这里，或点击选择<input type="file" id="photos" accept="image/*" multiple hidden></div>
  <div class="thumbs" id="thumbs"></div>
</div>

<div class="step">
  <h2><span class="no">②</span>生成候选（照片骨架 + 烘焙的游戏同款渲染）
    <label class="f" style="margin-left:14px">候选数量 <input type="number" id="n" value="8" min="2" max="12" style="width:70px"></label>
    <button id="genBtn" style="margin-left:14px">生成</button></h2>
  <div class="prog" id="candProg"></div>
  <div class="cards" id="cards"></div>
</div>

<div class="step">
  <h2><span class="no">③</span>微调与球员信息</h2>
  <div class="row">
    <label class="f">姓名 <input type="text" id="name" value="MyPlayer" maxlength="16"></label>
    <label class="f">位置 <select id="pos"><option>FW</option><option>MF</option><option>DF</option><option>GK</option></select></label>
    <label class="f">国籍 <select id="nat"></select></label>
    <label class="f">球队 <select id="team"></select></label>
    <label class="f">球衣号 <input type="number" id="jersey" value="21" min="1" max="99" style="width:80px"></label>
    <div class="muted" id="teamInfo"></div>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="f">发色 <select id="hair"></select></label>
    <label class="f">胡须 <select id="beard"></select></label>
    <label class="f">眉型 <select id="brow"></select></label>
  </div>
</div>

<div class="step">
  <h2><span class="no">④</span>BUILD → INSTALL</h2>
  <div class="row">
    <button id="buildBtn" disabled>BUILD PLAYER（自动分配独立脸槽）</button>
    <button id="installBtn" class="sec" disabled>INSTALL 到手机</button>
  </div>
  <div class="prog" id="buildProg"></div>
  <div class="kv" id="buildOut"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let PHOTOS = [], CAND_JOB = null, SELECTED = null, BUILD_JOB = null, CATALOG = null;

fetch('/api/catalog').then(r => r.json()).then(c => {
  CATALOG = c;
  const teams = (c.teams || []).filter(t => t.id >= 10000).sort((a, b) => a.roster_count - b.roster_count);
  $('#team').innerHTML = teams.map(t =>
    '<option value="' + t.id + '"' + (t.id === 20030 ? ' selected' : '') + '>' + (t.league || '') + ' / ' + t.display + ' — ' + t.roster_count + '/33</option>').join('');
  $('#nat').innerHTML = (c.nations || []).map((n, i) =>
    '<option value="' + i + '"' + (i === 24 ? ' selected' : '') + '>' + n.name + '</option>').join('');
  const hairNames = ['黑', '深棕', '棕', '浅棕', '金', '红', '灰白', '深灰', '浅灰', '酒红'];
  $('#hair').innerHTML = hairNames.map((n, i) => '<option value="' + i + '">' + n + '</option>').join('');
  const beards = ['无胡', '短髭', '长髭', '络腮', '山羊胡', '胡茬', '八字胡', '浓密络腮', '短须', '分髭', '下巴簇', '半络腮'];
  $('#beard').innerHTML = beards.map((n, i) => '<option value="' + i + '">' + n + '</option>').join('');
  const brows = ['自然', '浓眉', '细眉', '平眉', '剑眉', '弯眉', '淡眉'];
  $('#brow').innerHTML = brows.map((n, i) => '<option value="' + i + '">' + n + '</option>').join('');
  $('#team').onchange = teamInfo; teamInfo();
});
function teamInfo() {
  const t = (CATALOG.teams || []).find(x => x.id == $('#team').value);
  $('#teamInfo').textContent = t ? ('容量 ' + t.roster_count + '/33' + (t.roster_count >= 33 ? '（已满，请换队）' : '')) : '';
}

// ---- photos ----
const drop = $('#drop');
drop.onclick = () => $('#photos').click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
drop.ondragleave = () => drop.classList.remove('on');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); addPhotos(e.dataTransfer.files); };
$('#photos').onchange = e => addPhotos(e.target.files);
function addPhotos(list) {
  for (const f of list) {
    if (PHOTOS.length >= 3) break;
    PHOTOS.push(f);
    const d = document.createElement('div');
    d.className = 'th';
    d.innerHTML = '<img src="' + URL.createObjectURL(f) + '"><div class="pmark">' + (PHOTOS.length === 1 ? 'PRIMARY' : '#' + PHOTOS.length) + '</div>';
    $('#thumbs').appendChild(d);
  }
}

function sse(jobId, cb, done, isDone) {
  const es = new EventSource('/api/progress?job_id=' + jobId);
  es.onmessage = e => {
    const ev = JSON.parse(e.data); cb(ev);
    const fin = isDone ? isDone(ev) : (ev.state === 'PASS' || ev.state === 'FAIL');
    if (ev.state === 'FAIL' || fin) {
      es.close();
      if (ev.state === 'FAIL') cb(ev);
      done(ev);
    }
  };
  es.onerror = () => {};
}

// ---- candidates ----
$('#genBtn').onclick = () => {
  if (!PHOTOS.length) return alert('先上传照片');
  $('#genBtn').disabled = true; $('#cards').innerHTML = ''; SELECTED = null; $('#buildBtn').disabled = true;
  const fd = new FormData();
  PHOTOS.forEach(f => fd.append('files', f, f.name));
  fd.append('n', $('#n').value);
  fd.append('geometry', 'on');
  fetch('/api/candidates', {method: 'POST', body: fd}).then(r => r.json()).then(job => {
    CAND_JOB = job;
    sse(job.id, ev => {
      $('#candProg').textContent = ev.stage + ': ' + ev.state + ' ' + (ev.detail || '');
    }, async ev => {
      $('#genBtn').disabled = false;
      if (ev.state === 'FAIL') { $('#candProg').textContent = 'FAIL: ' + (ev.detail || ''); return; }
      const d = await (await fetch('/api/candidates/' + CAND_JOB.id)).json();
      renderCards(d.candidates || []);
    }, ev => ev.stage === 'PREVIEW' && ev.state === 'PASS');
  });
};
function renderCards(cands) {
  $('#cards').innerHTML = cands.map(c => {
    const gp = c.game_preview && c.game_preview.front;
    const img = gp;
    const rej = c.status === 'REJECT' ? ' rej' : '';
    const badge = '<span class="badge' + (c.status === 'REJECT' ? ' r' : '') + '">' + (c.status || '') + '</span>';
    const vl = gp
      ? '<div class="viewlinks">视角: <a href="' + gp + '" target="_blank">正</a><a href="' + c.game_preview['45L'] + '" target="_blank">45L</a><a href="' + c.game_preview['45R'] + '" target="_blank">45R</a><a href="' + c.game_preview.side + '" target="_blank">侧</a></div>'
      : '<div class="muted">渲染缺失（重试生成）</div>';
    const nm = $('#name').value || 'NEW PLAYER';
    const num = $('#jersey').value || '21';
    const pos = $('#pos').value;
    return '<div class="card' + rej + '" data-name="' + c.name + '">' +
      '<div class="imgbox">' + (img ? '<img src="' + img + '">' : '<div style="height:180px;display:flex;align-items:center;justify-content:center;color:#556;">渲染中…</div>') +
      '<div class="np"><span class="num">' + num + '</span><span class="nm">' + nm + '</span><span class="pos">' + pos + '</span></div></div>' +
      '<div class="cb"><b>' + c.name + '</b>' + badge + '<br>' + vl +
      '<button class="sec" style="margin-top:6px;padding:5px 12px" onclick="pick(\'' + c.name + '\')">SELECT</button></div></div>';
  }).join('');
}
window.pick = name => {
  SELECTED = name;
  document.querySelectorAll('.card').forEach(el => el.classList.toggle('sel', el.dataset.name === name));
  $('#buildBtn').disabled = false;
};

// ---- build ----
$('#buildBtn').onclick = () => {
  if (!CAND_JOB || !SELECTED) return alert('先选择一个候选');
  $('#buildBtn').disabled = true; $('#installBtn').disabled = true; $('#buildOut').textContent = '';
  fetch('/api/candidates/' + CAND_JOB.id).then(r => r.json()).then(async d => {
    const c = (d.candidates || []).find(x => x.name === SELECTED);
    const fd = new FormData();
    fd.append('reference_pid', 0);           // zero-clone, always
    fd.append('geometry', 'on');
    fd.append('name', $('#name').value);
    fd.append('position', $('#pos').value);
    fd.append('nat', $('#nat').value);
    fd.append('team_id', $('#team').value);
    fd.append('jersey', $('#jersey').value);
    fd.append('hair_color_id', $('#hair').value);
    fd.append('beard_enabled', $('#beard').value !== 'off');
    fd.append('beard_style_id', $('#beard').value === 'off' ? 1 : $('#beard').value);
    fd.append('eyebrow_index', Math.max(1, parseInt($('#brow').value) || 1));
    fd.append('skin_tone', 6);
    fd.append('face_texture_id', 0);         // auto EA slot (b1 10-15)
    if (c && c.baked) fd.append('candidate_baked', decodeURIComponent(c.baked.replace('/api/file/', '')));
    const job = await (await fetch('/api/build', {method: 'POST', body: fd})).json();
    BUILD_JOB = job;
    sse(job.id, ev => {
      $('#buildProg').textContent = ev.stage + ': ' + ev.state + ' ' + (ev.detail || '');
    }, async ev => {
      const j = await (await fetch('/api/job/' + job.id)).json();
      if (j.state === 'PASS') {
        $('#buildBtn').disabled = false; $('#installBtn').disabled = false;
        const r = j.result;
        $('#buildOut').textContent = 'PASS ✓ pid=' + r.pid + ' jersey=' + r.jersey +
          '\nAPK: ' + r.apk + '\nSHA256: ' + r.sha256.slice(0, 20) + '…';
      } else {
        $('#buildBtn').disabled = false;
        $('#buildOut').textContent = 'FAIL: ' + (j.error || '');
      }
    });
  });
};
$('#installBtn').onclick = async () => {
  if (!BUILD_JOB) return;
  $('#installBtn').disabled = true;
  const r = await (await fetch('/api/install/' + BUILD_JOB.id, {method: 'POST'})).json();
  $('#installBtn').disabled = false;
  $('#buildOut').textContent += '\nINSTALL: ' + (r.install || JSON.stringify(r));
};
</script>
</body>
</html>
